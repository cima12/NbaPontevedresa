name: Actualizar liga

on:
  workflow_dispatch:            # botón "Run workflow"
  schedule:                     # automático (hora UTC; en España +1 en invierno)
    - cron: "41 7 * * *"        # 08:41 España: tras los partidos de la noche
    - cron: "41 12 * * *"       # 13:41
    - cron: "41 17 * * *"       # 18:41: antes de que empiecen los partidos
    - cron: "11 22 * * *"       # 23:11: últimos cambios de alineación
# Mientras Yahoo no apruebe la app, termina en verde con "⏳" y no guarda nada.

permissions:
  contents: write

concurrency:
  group: guardar-datos          # nunca dos Actions guardando a la vez
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Leer datos de Yahoo
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/conexion.py

      - name: Avisos por Telegram (si están configurados)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MI_EQUIPO: "Grit & Grind"
        run: python scripts/avisos.py

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos liga $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
